<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>İdarə paneli | Plan lisenziyaları</title>
<style>
:root{--navy:#0b2545;--blue:#1e5aa8;--sky:#eaf3ff;--line:#dbe6f3;--ink:#1b2733;--muted:#5c7089;--warn:#c0392b;--ok:#1c8a5a;--bg:#f5f9fd}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Verdana,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--blue);border-radius:10px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--warn);border-color:#f1c6c0}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible{outline:3px solid #2f7fe0;outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row .meta{color:var(--muted);font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.ok{background:#e4f6ee;color:var(--ok)}.tag.bad{background:#fdecea;color:var(--warn)}
.msg{margin:10px 0;font-size:14px}.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Plan lisenziya paneli</h1>
  <div class="actions"><span id="who"></span><button class="btn" id="out" type="button" hidden>Çıxış</button></div>
</header>
<main>
  <div class="card" id="loginCard">
    <p>İdarə paneli yalnız sahib Google hesabı ilə açılır.</p>
    <button class="btn primary" id="in" type="button">Google ilə daxil ol</button>
    <div class="msg err" id="loginMsg" role="alert"></div>
  </div>

  <div id="panel" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="req" aria-selected="true">Sorğular</button>
      <button class="tab" role="tab" data-tab="lic" aria-selected="false">Lisenziyalar</button>
      <button class="tab" role="tab" data-tab="bank" aria-selected="false">Məşğələ bazası</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <div class="card" id="tab-req"></div>
    <div class="card" id="tab-lic" hidden></div>
    <div class="card" id="tab-bank" hidden></div>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script>
(function () {
  'use strict';
  var ADMIN_EMAIL = 'samir.akhundoff@gmail.com';
  firebase.initializeApp({
    apiKey: 'AIzaSyCBhyGNzZRGgQShP_C9kwAzTm_g_0zJlzg', authDomain: 'an-psixoloji-33442.firebaseapp.com',
    databaseURL: 'https://an-psixoloji-33442-default-rtdb.firebaseio.com', projectId: 'an-psixoloji-33442',
    storageBucket: 'an-psixoloji-33442.firebasestorage.app', messagingSenderId: '528809299356', appId: '1:528809299356:web:59cae89a64e446dc520c59'
  });
  var db = firebase.database(), auth = firebase.auth();
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function fmt(ts) { var d = new Date(ts); return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2) + '.' + d.getFullYear(); }
  function say(t, kind) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }
  function addMonths(ts, n) { var d = new Date(ts); d.setMonth(d.getMonth() + n); return d.getTime(); }
  function button(text, cls, fn) { var b = el('button', 'btn' + (cls ? ' ' + cls : ''), text); b.type = 'button'; b.addEventListener('click', function () { b.disabled = true; Promise.resolve(fn()).catch(function (e) { say('Xəta: ' + (e.code || e.message), 'err'); }).then(function () { b.disabled = false; }); }); return b; }

  $('in').addEventListener('click', function () {
    var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(p).catch(function (e) { $('loginMsg').textContent = 'Daxil olmaq mümkün olmadı: ' + (e.code || e.message); });
  });
  $('out').addEventListener('click', function () { auth.signOut(); });

  auth.onAuthStateChanged(function (u) {
    var ok = u && !u.isAnonymous && u.emailVerified && u.email === ADMIN_EMAIL;
    $('loginCard').hidden = !!ok; $('panel').hidden = !ok; $('out').hidden = !(u && !u.isAnonymous);
    $('who').textContent = u && !u.isAnonymous ? u.email : '';
    if (u && !u.isAnonymous && !ok) $('loginMsg').textContent = 'Bu hesabın icazəsi yoxdur.';
    if (ok) { showTab('req'); }
  });

  [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.addEventListener('click', function () { showTab(t.getAttribute('data-tab')); }); });
  function showTab(name) {
    ['req', 'lic', 'bank'].forEach(function (n) { $('tab-' + n).hidden = n !== name; });
    [].forEach.call(document.querySelectorAll('.tab'), function (t) { t.setAttribute('aria-selected', t.getAttribute('data-tab') === name ? 'true' : 'false'); });
    say('');
    ({ req: loadRequests, lic: loadLicenses, bank: loadBank })[name]();
  }

  function issue(uid, info, months) {
    return db.ref('plan_licenses/' + uid).once('value').then(function (s) {
      var cur = s.val(), now = Date.now();
      var base = cur && cur.expiresAt > now ? cur.expiresAt : now;
      var rec = { email: info.email, name: info.name || '', tier: months, issuedAt: now, expiresAt: addMonths(base, months) };
      return db.ref('plan_licenses/' + uid).set(rec).then(function () { return rec; });
    });
  }

  function loadRequests() {
    var box = $('tab-req'); box.textContent = '';
    box.appendChild(el('h2', null, 'Lisenziya sorğuları'));
    db.ref('plan_requests').once('value').then(function (s) {
      var v = s.val() || {}, keys = Object.keys(v).sort(function (a, b) { return v[b].ts - v[a].ts; });
      if (!keys.length) { box.appendChild(el('p', 'meta', 'Yeni sorğu yoxdur.')); return; }
      keys.forEach(function (uid) {
        var r = v[uid], row = el('div', 'row'), info = el('div');
        info.appendChild(el('b', null, (r.name || '-') + ' · ' + r.email));
        info.appendChild(el('div', 'meta', [r.work, r.phone, fmt(r.ts)].filter(Boolean).join(' · ')));
        var act = el('div', 'actions');
        [1, 6, 12].forEach(function (m) {
          act.appendChild(button(m + ' ay ver', 'primary', function () {
            return issue(uid, r, m).then(function (rec) { return db.ref('plan_requests/' + uid).remove().then(function () { say(r.email + ' üçün lisenziya verildi, bitmə tarixi ' + fmt(rec.expiresAt), 'ok'); loadRequests(); }); });
          }));
        });
        act.appendChild(button('Sil', 'danger', function () { return db.ref('plan_requests/' + uid).remove().then(loadRequests); }));
        row.appendChild(info); row.appendChild(act); box.appendChild(row);
      });
    }).catch(function (e) { say('Oxumaq mümkün olmadı: ' + (e.code || e.message), 'err'); });
  }

  function loadLicenses() {
    var box = $('tab-lic'); box.textContent = '';
    box.appendChild(el('h2', null, 'Lisenziyalar'));
    db.ref('plan_licenses').once('value').then(function (s) {
      var v = s.val() || {}, keys = Object.keys(v).sort(function (a, b) { return v[b].expiresAt - v[a].expiresAt; });
      if (!keys.length) { box.appendChild(el('p', 'meta', 'Lisenziya yoxdur.')); return; }
      keys.forEach(function (uid) {
        var r = v[uid], active = r.expiresAt > Date.now(), row = el('div', 'row'), info = el('div');
        var t = el('b', null, (r.name || '-') + ' · ' + r.email + ' ');
        t.appendChild(el('span', 'tag ' + (active ? 'ok' : 'bad'), active ? 'aktiv' : 'bitib'));
        info.appendChild(t);
        info.appendChild(el('div', 'meta', 'Bitmə: ' + fmt(r.expiresAt) + ' · Verilib: ' + fmt(r.issuedAt)));
        var act = el('div', 'actions');
        [1, 6, 12].forEach(function (m) { act.appendChild(button('+' + m + ' ay', '', function () { return issue(uid, r, m).then(function (rec) { say('Yeni bitmə tarixi: ' + fmt(rec.expiresAt), 'ok'); loadLicenses(); }); })); });
        act.appendChild(button('Ləğv et', 'danger', function () { if (!confirm('Lisenziya ləğv olunsun?')) return Promise.resolve(); return db.ref('plan_licenses/' + uid).remove().then(loadLicenses); }));
        row.appendChild(info); row.appendChild(act); box.appendChild(row);
      });
    }).catch(function (e) { say('Oxumaq mümkün olmadı: ' + (e.code || e.message), 'err'); });
  }

  function validateBank(b) {
    if (!b || typeof b !== 'object' || !b.act || typeof b.act !== 'object' || !b.needs) return 'Fayl baza formatında deyil.';
    var ids = Object.keys(b.act);
    if (ids.length < 10) return 'Məşğələ sayı çox azdır (' + ids.length + ').';
    var req = ['id', 'group', 't', 'needs', 'age', 'min', 'why', 'prep', 'how', 'say', 'avoid', 'measure', 'easier', 'harder', 'home', 'levels'];
    for (var i = 0; i < ids.length; i++) {
      var a = b.act[ids[i]];
      for (var j = 0; j < req.length; j++) if (a[req[j]] == null) return ids[i] + ': "' + req[j] + '" sahəsi yoxdur.';
      for (var l = 1; l <= 3; l++) if (!a.levels[l] || !a.levels[l].g || !a.levels[l].sup || !a.levels[l].ok) return ids[i] + ': səviyyə ' + l + ' natamamdır.';
    }
    return '';
  }

  function loadBank() {
    var box = $('tab-bank'); box.textContent = '';
    box.appendChild(el('h2', null, 'Məşğələ bazası'));
    var info = el('p', 'meta', 'Yüklənir...'); box.appendChild(info);
    db.ref('plan_bank/meta').once('value').then(function (s) {
      var m = s.val();
      info.textContent = m ? 'Cari baza: versiya ' + m.version + ', ' + m.count + ' məşğələ, ' + Math.round(m.size / 1024) + ' KB, yenilənib ' + fmt(m.updatedAt) : 'Baza hələ yüklənməyib.';
    }).catch(function (e) { info.textContent = 'Oxumaq mümkün olmadı: ' + (e.code || e.message); });
    var file = el('input'); file.type = 'file'; file.accept = '.json,application/json'; file.setAttribute('aria-label', 'Baza faylı');
    box.appendChild(file);
    var go = button('Bazanı yüklə', 'primary', function () {
      var f = file.files && file.files[0];
      if (!f) { say('Fayl seçin.', 'err'); return Promise.resolve(); }
      return f.text().then(function (txt) {
        var b; try { b = JSON.parse(txt); } catch (e) { say('JSON oxunmadı.', 'err'); return; }
        var err = validateBank(b); if (err) { say(err, 'err'); return; }
        if (txt.length > 4 * 1024 * 1024) { say('Fayl çox böyükdür.', 'err'); return; }
        var data = JSON.stringify(b);
        return db.ref('plan_bank').update({ data: data, meta: { version: b.version || 0, count: Object.keys(b.act).length, size: data.length, updatedAt: Date.now() } })
          .then(function () { say('Baza yeniləndi: ' + Object.keys(b.act).length + ' məşğələ.', 'ok'); loadBank(); });
      });
    });
    go.style.marginLeft = '8px'; box.appendChild(go);
  }
})();
</script>
</body>
</html>
